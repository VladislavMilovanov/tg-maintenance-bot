name: GHCR Images

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ghcr-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-validation:
    name: Build validation (${{ matrix.service.name }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            image: ghcr.io/vladislavmilovanov/tg-maintenance-bot-backend
            dockerfile: devops/backend/Dockerfile
          - name: frontend
            image: ghcr.io/vladislavmilovanov/tg-maintenance-bot-frontend
            dockerfile: devops/frontend/Dockerfile
          - name: bot
            image: ghcr.io/vladislavmilovanov/tg-maintenance-bot-bot
            dockerfile: devops/bot/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: false
          tags: ${{ matrix.service.image }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  publish:
    name: Publish (${{ matrix.service.name }})
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            image: ghcr.io/vladislavmilovanov/tg-maintenance-bot-backend
            dockerfile: devops/backend/Dockerfile
          - name: frontend
            image: ghcr.io/vladislavmilovanov/tg-maintenance-bot-frontend
            dockerfile: devops/frontend/Dockerfile
          - name: bot
            image: ghcr.io/vladislavmilovanov/tg-maintenance-bot-bot
            dockerfile: devops/bot/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.service.image }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=v(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
