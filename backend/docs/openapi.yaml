openapi: 3.1.0
info:
  title: TG Maintenance Backend API
  version: 0.1.0
  summary: MVP contracts for assistant interaction and equipment state recording
  description: |
    OpenAPI-first specification for iteration 1 backend foundation.
    The spec covers two MVP scenarios for thin clients: assistant messages and
    manual equipment state records.
servers:
  - url: http://localhost:8000
    description: Local development server
tags:
  - name: assistant
    description: Assistant interaction flow for bot and web clients
  - name: equipment-state-records
    description: Manual equipment state capture flow
  - name: service
    description: Operational service endpoints
  - name: auth
    description: Temporary authentication
  - name: dashboard
    description: Plant overview and feeds
  - name: equipment-read
    description: Equipment listing and details
  - name: sensor-groups
    description: Sensor group details
  - name: locations
    description: Location hierarchy
  - name: admin
    description: Admin panel endpoints
paths:
  /health:
    get:
      tags:
        - service
      operationId: getHealth
      summary: Liveness check
      responses:
        '200':
          description: Service process is alive
  /ready:
    get:
      tags:
        - service
      operationId: getReady
      summary: Readiness check
      responses:
        '200':
          description: Service is ready to accept traffic
        '503':
          description: Required dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/assistant/messages:
    post:
      tags:
        - assistant
      operationId: createAssistantMessage
      summary: Create assistant response for a client message
      description: |
        Accepts a user message from a thin client, optional dialog context, and
        optional equipment context. Backend owns conversation history handling
        and LLM invocation. If `conversation_id` is omitted, unknown, or expired,
        backend creates a new conversation and still returns `200`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantMessageRequest'
      responses:
        '200':
          description: |
            Assistant response created successfully. This includes degraded
            fallback replies when backend can still return a user-facing answer;
            such responses must set `meta.fallback_used=true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantMessageResponse'
        '400':
          description: |
            Malformed request that cannot be parsed or processed at HTTP layer,
            for example invalid JSON payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            Parsed request is structurally valid, but business or contract
            validation failed, for example unknown equipment context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            LLM service or interpretation flow is unavailable and backend cannot
            produce even a degraded fallback answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/equipment-state-records:
    post:
      tags:
        - equipment-state-records
      operationId: createEquipmentStateRecord
      summary: Record manual equipment state
      description: |
        Accepts a minimal MVP state record for one equipment unit. The contract
        intentionally excludes nested sensor observations, files, and review
        workflow. If `idempotency_key` is omitted, every successful request is
        treated as a new record creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentStateRecordCreateRequest'
      responses:
        '201':
          description: Equipment state record created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentStateRecordResponse'
        '400':
          description: |
            Malformed request that cannot be parsed or processed at HTTP layer,
            for example invalid JSON payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Equipment was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Request conflicts with a previously accepted request that used the
            same `idempotency_key` with a different payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            Parsed request is structurally valid, but business or contract
            validation failed, for example unsupported status value or invalid
            observed timestamp semantics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      tags:
        - auth
      operationId: loginByTelegramUsername
      summary: Login by Telegram username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/me:
    get:
      tags:
        - auth
      operationId: getCurrentUser
      summary: Get current authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/dashboard/plant:
    get:
      tags:
        - dashboard
      operationId: getPlantOverview
      summary: Get aggregated plant overview
      parameters:
        - name: location_id
          in: query
          required: false
          schema:
            type:
              - string
              - 'null'
      responses:
        '200':
          description: Plant overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantOverviewResponse'
  /api/v1/dashboard/state-feed:
    get:
      tags:
        - dashboard
      operationId: getStateFeed
      summary: Paginated feed of equipment state changes
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: State change feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateFeedResponse'
  /api/v1/dashboard/action-feed:
    get:
      tags:
        - dashboard
      operationId: getActionFeed
      summary: Paginated feed of manual state records
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Action feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionFeedResponse'
  /api/v1/equipment:
    get:
      tags:
        - equipment-read
      operationId: listEquipment
      summary: Paginated list of equipment
      parameters:
        - name: location_id
          in: query
          required: false
          schema:
            type:
              - string
              - 'null'
        - name: status
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/EquipmentStatus'
              - type: 'null'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Equipment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentListResponse'
  /api/v1/equipment/{equipment_id}:
    get:
      tags:
        - equipment-read
      operationId: getEquipmentDetail
      summary: Get equipment detail card
      parameters:
        - name: equipment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Equipment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentDetailResponse'
        '404':
          description: Equipment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/equipment/{equipment_id}/history:
    get:
      tags:
        - equipment-read
      operationId: getEquipmentHistory
      summary: Paginated state history for equipment
      parameters:
        - name: equipment_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Equipment state history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentHistoryResponse'
        '404':
          description: Equipment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/sensor-groups/{sensor_group_id}:
    get:
      tags:
        - sensor-groups
      operationId: getSensorGroupDetail
      summary: Get sensor group detail card
      parameters:
        - name: sensor_group_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sensor group detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorGroupDetailResponse'
        '404':
          description: Sensor group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/locations/tree:
    get:
      tags:
        - locations
      operationId: getLocationTree
      summary: Get hierarchical location tree
      responses:
        '200':
          description: Location tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationTreeResponse'
  /api/v1/admin/dashboard:
    get:
      tags:
        - admin
      operationId: getAdminDashboard
      summary: Get admin dashboard KPIs and charts
      responses:
        '200':
          description: Admin dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardResponse'
  /api/v1/admin/clients:
    get:
      tags:
        - admin
      operationId: listAdminClients
      summary: Paginated list of clients
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Client list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClientsResponse'
  /api/v1/admin/events:
    get:
      tags:
        - admin
      operationId: listAdminEvents
      summary: Paginated feed of recent events
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Event feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventsResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    Channel:
      type: string
      description: Client channel that calls backend API
      enum:
        - telegram
        - web
    UserRole:
      type: string
      description: Minimal caller role context provided by client
      enum:
        - user
        - admin
        - operator
        - engineer
    EquipmentStatus:
      type: string
      description: MVP equipment status enum
      enum:
        - normal
        - warning
        - critical
        - unknown
    ClientUser:
      type: object
      additionalProperties: false
      required:
        - external_id
      properties:
        external_id:
          type: string
          minLength: 1
          description: External user identifier in client system
          examples:
            - telegram:123456
        display_name:
          type:
            - string
            - 'null'
          minLength: 1
        role:
          anyOf:
            - $ref: '#/components/schemas/UserRole'
            - type: 'null'
    AssistantMessagePayload:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          description: Raw user message text
          examples:
            - Что с компрессором К-12?
    EquipmentContext:
      type: object
      additionalProperties: false
      properties:
        equipment_id:
          type:
            - string
            - 'null'
          minLength: 1
        sensor_ids:
          type: array
          items:
            type: string
            minLength: 1
          uniqueItems: true
        sensor_group_ids:
          type: array
          items:
            type: string
            minLength: 1
          uniqueItems: true
      description: |
        Optional context known by client. Backend may use it to refine the
        answer, but owns final validation and interpretation.
    AssistantMessageRequest:
      type: object
      additionalProperties: false
      required:
        - channel
        - user
        - message
      properties:
        channel:
          $ref: '#/components/schemas/Channel'
        user:
          $ref: '#/components/schemas/ClientUser'
        conversation_id:
          type:
            - string
            - 'null'
          minLength: 1
          description: |
            Client-visible conversation identifier. Backend creates a new value
            when the field is omitted, unknown, or expired.
        message:
          $ref: '#/components/schemas/AssistantMessagePayload'
        equipment_context:
          anyOf:
            - $ref: '#/components/schemas/EquipmentContext'
            - type: 'null'
    AssistantResponseMeta:
      type: object
      additionalProperties: false
      required:
        - fallback_used
      properties:
        fallback_used:
          type: boolean
          description: True when backend returned a degraded response
        trace_id:
          type:
            - string
            - 'null'
          minLength: 1
    ContextUsed:
      type: object
      additionalProperties: false
      properties:
        equipment_id:
          type:
            - string
            - 'null'
        sensor_ids:
          type: array
          items:
            type: string
        sensor_group_ids:
          type: array
          items:
            type: string
        sources:
          type: array
          description: Optional human-readable context sources used by backend
          items:
            type: string
    AssistantMessageResponse:
      type: object
      additionalProperties: false
      required:
        - answer
        - conversation_id
        - meta
      properties:
        answer:
          type: string
          minLength: 1
        conversation_id:
          type: string
          minLength: 1
        context_used:
          anyOf:
            - $ref: '#/components/schemas/ContextUsed'
            - type: 'null'
        meta:
          $ref: '#/components/schemas/AssistantResponseMeta'
    StateRecordAuthor:
      type: object
      additionalProperties: false
      required:
        - external_id
      properties:
        external_id:
          type: string
          minLength: 1
          description: External client-side user identifier
        display_name:
          type:
            - string
            - 'null'
          minLength: 1
        role:
          anyOf:
            - $ref: '#/components/schemas/UserRole'
            - type: 'null'
    EquipmentStateRecordCreateRequest:
      type: object
      additionalProperties: false
      required:
        - equipment_id
        - status
        - observed_at
        - channel
        - author
      properties:
        equipment_id:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/EquipmentStatus'
        comment:
          type:
            - string
            - 'null'
          maxLength: 2000
        idempotency_key:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 128
          description: |
            Optional client-supplied key for safe retries. Reusing the same key
            with a different payload yields `409`; reusing it with the same
            payload should return the original successful result.
        observed_at:
          type: string
          format: date-time
        channel:
          $ref: '#/components/schemas/Channel'
        author:
          $ref: '#/components/schemas/StateRecordAuthor'
    EquipmentStateRecordResponse:
      type: object
      additionalProperties: false
      required:
        - record_id
        - equipment_id
        - status
        - comment
        - observed_at
        - created_at
        - channel
        - author
      properties:
        record_id:
          type: string
          minLength: 1
        equipment_id:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/EquipmentStatus'
        comment:
          type:
            - string
            - 'null'
        observed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        channel:
          $ref: '#/components/schemas/Channel'
        author:
          $ref: '#/components/schemas/StateRecordAuthor'
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          minLength: 1
          examples:
            - validation_error
          description: |
            Stable machine-readable error code such as `malformed_request`,
            `validation_error`, `resource_not_found`, `idempotency_conflict`,
            or `service_unavailable`.
        message:
          type: string
          minLength: 1
        details:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/ErrorDetail'
        trace_id:
          type:
            - string
            - 'null'
          minLength: 1
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - field
        - issue
      properties:
        field:
          type: string
          minLength: 1
        issue:
          type: string
          minLength: 1
    AuthLoginRequest:
      type: object
      additionalProperties: false
      required:
        - telegram_username
      properties:
        telegram_username:
          type: string
          minLength: 1
    AuthLoginResponse:
      type: object
      additionalProperties: false
      required:
        - actor_id
        - external_id
        - display_name
        - role
        - token
      properties:
        actor_id:
          type: string
          minLength: 1
        external_id:
          type: string
          minLength: 1
        display_name:
          type:
            - string
            - 'null'
          minLength: 1
        role:
          anyOf:
            - $ref: '#/components/schemas/UserRole'
            - type: 'null'
        token:
          type: string
          minLength: 1
    AuthMeResponse:
      type: object
      additionalProperties: false
      required:
        - actor_id
        - external_id
        - display_name
        - role
      properties:
        actor_id:
          type: string
          minLength: 1
        external_id:
          type: string
          minLength: 1
        display_name:
          type:
            - string
            - 'null'
          minLength: 1
        role:
          anyOf:
            - $ref: '#/components/schemas/UserRole'
            - type: 'null'
    StatusSummary:
      type: object
      additionalProperties: false
      required:
        - normal
        - warning
        - critical
        - unknown
      properties:
        normal:
          type: integer
        warning:
          type: integer
        critical:
          type: integer
        unknown:
          type: integer
    DailyStatusEntry:
      type: object
      additionalProperties: false
      required:
        - date
        - normal
        - warning
        - critical
        - unknown
      properties:
        date:
          type: string
          format: date
        normal:
          type: integer
        warning:
          type: integer
        critical:
          type: integer
        unknown:
          type: integer
    WorstPerformerEntry:
      type: object
      additionalProperties: false
      required:
        - equipment_id
        - name
        - current_status
        - location_name
        - last_changed_at
      properties:
        equipment_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        current_status:
          $ref: '#/components/schemas/EquipmentStatus'
        location_name:
          type: string
          minLength: 1
        last_changed_at:
          type:
            - string
            - 'null'
          format: date-time
    PlantOverviewResponse:
      type: object
      additionalProperties: false
      required:
        - plant_status
        - status_summary
        - daily_history
        - worst_performers
      properties:
        plant_status:
          $ref: '#/components/schemas/EquipmentStatus'
        status_summary:
          $ref: '#/components/schemas/StatusSummary'
        daily_history:
          type: array
          items:
            $ref: '#/components/schemas/DailyStatusEntry'
        worst_performers:
          type: array
          items:
            $ref: '#/components/schemas/WorstPerformerEntry'
    StateChangeEntry:
      type: object
      additionalProperties: false
      required:
        - equipment_id
        - equipment_name
        - old_status
        - new_status
        - changed_at
      properties:
        equipment_id:
          type: string
          minLength: 1
        equipment_name:
          type: string
          minLength: 1
        old_status:
          anyOf:
            - $ref: '#/components/schemas/EquipmentStatus'
            - type: 'null'
        new_status:
          $ref: '#/components/schemas/EquipmentStatus'
        changed_at:
          type: string
          format: date-time
    StateFeedResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StateChangeEntry'
        total:
          type: integer
    ActionFeedEntry:
      type: object
      additionalProperties: false
      required:
        - record_id
        - equipment_id
        - equipment_name
        - status
        - comment
        - author_name
        - observed_at
        - channel
      properties:
        record_id:
          type: string
          minLength: 1
        equipment_id:
          type: string
          minLength: 1
        equipment_name:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/EquipmentStatus'
        comment:
          type:
            - string
            - 'null'
        author_name:
          type:
            - string
            - 'null'
        observed_at:
          type: string
          format: date-time
        channel:
          $ref: '#/components/schemas/Channel'
    ActionFeedResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActionFeedEntry'
        total:
          type: integer
    LocationBrief:
      type: object
      additionalProperties: false
      required:
        - location_id
        - name
      properties:
        location_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
    ActorBrief:
      type: object
      additionalProperties: false
      required:
        - actor_id
        - display_name
      properties:
        actor_id:
          type: string
          minLength: 1
        display_name:
          type:
            - string
            - 'null'
    EquipmentBrief:
      type: object
      additionalProperties: false
      required:
        - equipment_id
        - name
      properties:
        equipment_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
    SensorGroupBrief:
      type: object
      additionalProperties: false
      required:
        - sensor_group_id
        - name
        - status
        - group_type
      properties:
        sensor_group_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/EquipmentStatus'
        group_type:
          type: string
          minLength: 1
    SensorEntry:
      type: object
      additionalProperties: false
      required:
        - sensor_id
        - name
        - sensor_type
        - last_observed_at
      properties:
        sensor_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        sensor_type:
          type: string
          minLength: 1
        last_observed_at:
          type:
            - string
            - 'null'
          format: date-time
    EquipmentListItem:
      type: object
      additionalProperties: false
      required:
        - equipment_id
        - name
        - equipment_code
        - current_status
        - location
        - owner
      properties:
        equipment_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        equipment_code:
          type:
            - string
            - 'null'
        current_status:
          $ref: '#/components/schemas/EquipmentStatus'
        location:
