[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maintenance-bot"
version = "0.1.0"
description = "Telegram-бот — помощник по состоянию оборудования"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.4",
    "openai>=1.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1",
]

[project.scripts]
maintenance-bot = "maintenance_bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]
