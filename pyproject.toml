[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maintenance-bot"
version = "0.1.0"
description = "Telegram-бот — помощник по состоянию оборудования"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.4",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "greenlet>=3.1",
    "httpx>=0.27",
    "openai>=1.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "SQLAlchemy>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.1",
]

[project.scripts]
maintenance-bot = "maintenance_bot.main:main"
maintenance-backend = "maintenance_backend.main:main"

[tool.setuptools.packages.find]
where = ["src", "backend/src"]
